<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Seminar</title>
</head>
<body>
    <h1>Formulir pendaftaran seminar</h1>
     <h2>Data Peserta</h2>
    <!-- Formulir untuk memasukkan data -->
     <form action ="" method="post" enctype="multipart/form-data">
        <table cellspacing="4" cellpading="4" border="1" style="border-collapse :collapse; width: 100%;">
            <!-- input nama-->
             <tr>
                <td style="width: 32%;">
                    <label for="namaLengkhap"><strong>Nama Lengkap</strong>
                    </label>
                </td>
                <td>
                    <input type="text" id="namaLengkhap" name="namaLengkhap" size="30"/>
                </td>
             </tr>
             <!-- Input NIM-->
             <tr>
                <td>
                    <label for="NHIM"><strong>NIM</strong>
                    </label>
                </td>
                <td>
                    <input type="text" id="NHIM" name="NHIM" size="30"/>
                </td>
             </tr>
             <!--Pilihan jenis kelamin menggunakan radio button-->
             <tr>
                <td>
                    <strong>Jenis Kelamin</strong>
                </td>
                <td>
                    <input type="radio" id="laki" name="jk" value="Laki-Laki"/><label for="laki">Laki-Laki</label>
                    <input type="radio" id="perempuan" name="jk" value="perempuan"/><label for="perempuan">Perempuan</label>
                </td>
             </tr>
             <!-- pilihan program studi menggunakan dropdown-->
             <tr>
                <td>
                    <label for ="prodi"><strong>Program</strong>
                    </label>
                </td>
                <td>
                    <select id="prodi" name ="prodi">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
             </tr>
        </table>
        <h2>Pilihan Seminar</h2>
    <!-- Formulir untuk memasukkan data -->
        <table cellspacing="4" cellpading="4" border="1" style="border-collapse :collapse; width: 100%;">

             <!--Input Jenis Tiket-->
             <tr>
                <td style="width: 32%;">
                    <strong>Jenis Tiket</strong>
                </td>
                <td>
                    <input type="radio" id="Reguler" name="jt" value="Reguler"/><label for="Reguler">Reguler</label>
                    <input type="radio" id="VIP" name="jt" value="VIP"/><label for="VIP">VIP</label>
                </td>
             </tr>
             <!-- Pilihan Topik Seminar -->
            <tr>
                <td style="vertical-align: top;">
                    <strong>Topik Seminar</strong>
                </td>
                <td>
                    <input type="checkbox" id="topik1" name="topik[]" value="Web Development" />
                    <label for="topik1">Web Development</label><br />
                    
                    <input type="checkbox" id="topik2" name="topik[]" value="Data Science" />
                    <label for="topik2">Data Science</label><br />
                    
                    <input type="checkbox" id="topik3" name="topik[]" value="Artificial Intelligence" />
                    <label for="topik3">Artificial Intelligence</label>
                </td>
            </tr>
        </table>
        <h2>Informasi Tambahan </h2>
        <!-- Formulir untuk memasukkan data -->
        <table cellspacing="4" cellpading="4" border="1" style="border-collapse :collapse; width: 100%;">
            <!--Kolom untuk menuliskan resume-->
             <tr>
                <td style="width: 32%;">
                    <label for="resume">
                        <strong>Resume</strong>
                    </label>
                </td>
                <td>
                    <textarea id="resume" name="resume" rows="10" cols="23"></textarea>
                </td>
             </tr>
            <!--Input file foto pembayaran-->
            <tr>
                <td>
                    <label for="photo"><strong>Bukti Pembayaran</strong>
                    </label>
                </td>
                <td>
                    <input type="file" id="photo" name="photo" size="18" accept="image/gif,image/jpeg,image/png"/>
                </td>
            </tr>
             <!--tombol untuk menyimpan data-->
             <tr>
                <!--colspan="2"menggabungkan dua kolom menjadi satu-->
                <td colspan="2" style="text-align: center;">
                    <input type="submit" name="simpan" value="simpan"/>
                </td>
             </tr>
        </table>
     </form>
</body>
</html>
